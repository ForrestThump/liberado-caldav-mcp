[package]
name = "caldav-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "caldav-mcp"
path = "src/main.rs"

[dependencies]
turbomcp = { version = "3.1.2", features = ["http"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
